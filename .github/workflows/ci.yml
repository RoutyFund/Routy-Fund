name: CI
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test
      - name: Emit mobile deploy bytecodes
        shell: bash
        run: |
          echo "ROUTY_ARTIFACTS_BEGIN"
          for C in AssetRegistry OracleRegistry SwapExecutor OracleGuard FeeRouterFactory AssetVaultFactory ProtocolLauncher; do
            printf "%s=" "$C"
            forge inspect "$C" bytecode | tr -d '\n'
            printf "\n"
          done
          echo "ROUTY_ARTIFACTS_END"
      - name: Package browser deployment artifacts
        shell: bash
        run: |
          mkdir -p ../deploy-artifacts
          for C in AssetRegistry OracleRegistry SwapExecutor OracleGuard FeeRouterFactory AssetVaultFactory ProtocolLauncher; do
            forge inspect "$C" bytecode > "../deploy-artifacts/$C.bytecode"
            forge inspect "$C" abi > "../deploy-artifacts/$C.abi.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: routy-mobile-deploy-artifacts
          path: deploy-artifacts
