name: CI
permissions:
  contents: write
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run test:deployment
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test
      - name: Emit mobile deploy bytecodes
        shell: bash
        run: |
          echo "ROUTY_ARTIFACTS_BEGIN"
          for C in AssetRegistry OracleRegistry SwapExecutor OracleGuard SwapOracleQuoter SwapRouterAdapter FeeRouterFactory AssetVaultFactory ProtocolLauncher AutoPushRewardDistributor RewardDistributorFactory AssetVaultV2 AssetVaultV2Factory RewardFundingAutomation; do
            printf "%s=" "$C"
            forge inspect "$C" bytecode | tr -d '\n'
            printf "\n"
          done
          echo "ROUTY_ARTIFACTS_END"
      - name: Package browser deployment artifacts
        shell: bash
        run: |
          mkdir -p ../deploy-artifacts
          for C in AssetRegistry OracleRegistry SwapExecutor OracleGuard SwapOracleQuoter SwapRouterAdapter FeeRouterFactory AssetVaultFactory ProtocolLauncher AutoPushRewardDistributor RewardDistributorFactory AssetVaultV2 AssetVaultV2Factory RewardFundingAutomation; do
            forge inspect "$C" bytecode > "../deploy-artifacts/$C.bytecode"
            forge inspect "$C" abi > "../deploy-artifacts/$C.abi.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: routy-mobile-deploy-artifacts
          path: deploy-artifacts
      - name: Publish verified browser bytecodes
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          names = ["AssetRegistry","OracleRegistry","SwapExecutor","OracleGuard","SwapOracleQuoter","SwapRouterAdapter","FeeRouterFactory","AssetVaultFactory","ProtocolLauncher","AutoPushRewardDistributor","RewardDistributorFactory","AssetVaultV2","AssetVaultV2Factory","RewardFundingAutomation"]
          out = {n: pathlib.Path("../deploy-artifacts", n + ".bytecode").read_text().strip() for n in names}
          p = pathlib.Path("../src/lib/deploy-artifacts.ts")
          p.write_text("// Generated by successful Foundry CI. Do not edit manually.\nexport const DEPLOY_BYTECODE = " + json.dumps(out,separators=(",",":")) + " as const;\n")
          PY
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/deploy-artifacts.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: publish verified mobile deploy bytecodes"
          git push
