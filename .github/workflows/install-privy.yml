name: Install Privy dependency
on:
  push:
    paths:
      - ".github/workflows/install-privy.yml"
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @privy-io/react-auth@3.47.0 --save
      - run: |
          git config user.name "RoutyFund Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Add Privy React SDK"
          git push
